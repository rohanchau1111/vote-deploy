apiVersion: apps/v1
kind: Deployment
metadata:
  name: result
  labels:
    app: result
    tier: front
spec:
  replicas: 1
  selector:
    matchLabels:
      app: result
  template:
    metadata:
      labels:
        app: result
        tier: front
    spec:
      containers:
      - name: result
        image: <image>:v1
        ports:
        - containerPort: 80
          name: result
