apiVersion: v1
kind: Service
metadata:
  name: db-headless
  labels:
    app: db
spec:
  type: ClusterIP
  clusterIP: None
  # Governs the StatefulSet's stable pod DNS (db-0.db-headless), so entries must
  # exist before the pod passes its readiness probe.
  publishNotReadyAddresses: true
  ports:
  - port: 5432
    targetPort: postgres
    name: postgres
  selector:
    app: db
