apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: result
  labels:
    app: result
    tier: back
spec:
  replicas: 2
  selector:
    matchLabels:
      app: result
  strategy:
    blueGreen:
      autoPromotionEnabled: true
      autoPromotionSeconds: 30
      activeService: result
      previewService: result-preview
  template:
    metadata:
      labels:
        app: result
        tier: back
    spec:
      containers:
      - name: result
        image: <image>:v1
        ports:
        - containerPort: 80
          name: result
        envFrom:
        - configMapRef:
            name: backend-config
